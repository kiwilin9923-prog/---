<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Taipei City Fanghe Experimental High School｜芳和實中 Mini AI Assistant</title>
<style>
:root{--blue:#1769d2;--light:#eef5ff;--line:#d7dee8;--ink:#263445;--muted:#6d7a8a}
*{box-sizing:border-box} body{margin:0;background:#f4f7fb;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
.shell{max-width:1380px;width:96%;margin:22px auto;padding:0 18px}.head{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--blue);display:grid;place-items:center;color:white;font-size:25px}
h1{font-size:25px;margin:0}.sub{color:var(--muted);font-size:14px;margin-top:3px}
.card{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px #1b365d12;overflow:hidden}
.chat{height:570px;overflow:auto;padding:18px}.msg{max-width:86%;padding:12px 14px;margin:9px 0;border-radius:12px;white-space:pre-wrap;line-height:1.65}
.user{margin-left:auto;background:#dcecff}.ai{background:#fff;border:1px solid var(--line)}.role{font-size:12px;color:#7b8796;margin-bottom:4px}
.quick{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.quick button,.chips button{border:1px solid #bfd0e5;background:white;border-radius:999px;padding:7px 11px;cursor:pointer;color:#36526f}
.quick button:hover,.chips button:hover{background:var(--light)}
.helper{margin:0 18px 14px;padding:12px 14px;border:1px solid #cddaea;border-radius:12px;background:#f8fbff}
.helper b{display:block;margin-bottom:8px}.chips{display:flex;gap:7px;flex-wrap:wrap}
.entry{padding:0 18px 18px}.entry label{display:block;font-weight:600;margin-bottom:6px}
textarea{width:100%;min-height:86px;border:1.5px solid #aab8c8;border-radius:9px;padding:11px;font:inherit;resize:vertical}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:9px}.hint{font-size:12px;color:var(--muted)}
.send{border:0;border-radius:8px;background:var(--blue);color:#fff;padding:10px 21px;font-weight:700;cursor:pointer}.clear{border:1px solid #aab8c8;border-radius:8px;background:#fff;color:#526579;padding:9px 18px;font-weight:700;cursor:pointer}.clear:hover{background:#f1f5f9}.action-buttons{display:flex;gap:9px;align-items:center}
.mode{display:inline-block;margin-bottom:7px;padding:3px 9px;border-radius:999px;background:#eef5ff;color:#36526f;font-size:12px;font-weight:700} a{color:#1262b3;text-decoration:underline;text-underline-offset:2px}.status{padding:10px 18px;background:#f8fbff;border-bottom:1px solid var(--line);font-size:13px;color:#58708b}
</style>
</head>
<body>
<div class="shell">
  <div class="head">
    <div class="logo">🎓</div>
    <div><h1>Taipei City Fanghe Experimental High School｜芳和實中 Mini AI Assistant</h1>
    <div class="sub">臺北市芳和實驗中學｜校園公開資料智慧查詢 DEMO</div></div>
  </div>
  <div class="card">
    <div class="status">資料原則：校規、分機、學生手冊、請假、獎懲、行動載具與行事曆以芳和實中官方來源為準。</div>
    <div id="chat" class="chat"><div class="msg ai"><div class="role">AI</div>您好，我是芳和實中校園查詢小幫手。請直接輸入問題，或使用下方快速查詢。</div></div>
    <div class="helper"><b>🔎 芳和實中常用查詢</b><div class="chips">
      <button data-q="生活教育組分機是多少？">📞 生活教育組 303</button>
      <button data-q="教學課務組分機是多少？">📚 教學課務組 202</button>
      <button data-q="輔導諮商組分機是多少？">💬 輔導諮商組 602</button>
      <button data-q="學生事務中心分機是多少？">🏢 學生事務中心？</button>
      <button data-q="課程發展中心分機是多少？">📖 課程發展中心？</button>
      <button data-q="學生輔導中心分機是多少？">🧭 學生輔導中心？</button>
      <button data-q="學生請假專線是多少？">📝 請假專線</button>
      <button data-q="學生請假需要哪些程序？請附來源。">📋 請假程序？</button>
      <button data-q="115學年度學生手冊">📘 115學生手冊</button>
      <button data-q="請介紹芳和實中的學校願景，請依芳和實中官方資料回答並附來源。">🏫 學校願景</button>
      <button type="button" onclick="window.open('https://www.fhehs.tp.edu.tw/calendar/','_blank','noopener')">🗓️ 115行事曆 ↗</button>
      <button data-q="今天臺北天氣？">☀️ 臺北天氣</button>
    </div></div>
    <div class="helper"><b>📚 芳和實中法規快捷查詢</b><div class="chips">
      <button data-q="請查詢芳和實中學生請假辦法，整理學生請假程序、病假規定與期限，並附官方來源。">📝 學生請假辦法</button>
      <button data-q="請查詢芳和實中學生獎懲實施要點，說明警告、小過、大過等規定，並附官方來源。">🏆 學生獎懲規定</button>
      <button data-q="請查詢芳和實中行動學習載具使用暨管理規範，整理學生使用載具的重要規定，並附官方來源。">📱 行動載具規範</button>
      <button data-q="請查詢芳和實中學生申訴案件處理要點，整理申訴方式與程序，並附官方來源。">⚖️ 學生申訴規定</button>
      <button data-q="請查詢芳和實中學生手冊中的服裝儀容與生活常規，整理重點並附官方來源。">👕 服裝儀容／生活常規</button>
    </div></div>
    <div class="entry"><label for="q">輸入問題</label>
      <textarea id="q" placeholder="例如：生活教育組分機是多少？"></textarea>
      <div class="actions"><span class="hint">按「送出」或 Ctrl+Enter 查詢</span><div class="action-buttons"><button id="clear" class="clear" type="button">清除對話</button><button id="send" class="send">送出</button></div></div>
    </div>
  </div>
</div>
<script>
const chat=document.querySelector('#chat'), q=document.querySelector('#q'), send=document.querySelector('#send'), clearBtn=document.querySelector('#clear');
const welcome='<div class="msg ai"><div class="role">AI</div><div>您好，我是芳和實中校園查詢小幫手。請直接輸入問題，或使用下方快速查詢。</div></div>';
function escapeHtml(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));}
function linkify(text){
  const raw=String(text??'');
  const tokenRe=/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|(https?:\/\/[^\s<>()]+)/g;
  let out='', last=0, m;
  while((m=tokenRe.exec(raw))!==null){
    out+=escapeHtml(raw.slice(last,m.index));
    const label=m[1]||m[3];
    const url=m[2]||m[3];
    out+=`<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)} ↗</a>`;
    last=tokenRe.lastIndex;
  }
  out+=escapeHtml(raw.slice(last));
  return out.replace(/\n/g,'<br>');
}
function isGeminiMode(text){return /我是|如果|假如|因為|應該|怎麼辦|怎麼做|如何|哪些程序|流程|步驟|整理|說明|解釋|比較|差異|建議|為什麼|原因|依照.*規定|根據.*規定|請幫我|幫我|需要準備|注意事項|可以嗎|能不能|是否可以/.test(text);}
function add(role,text,mode=''){const d=document.createElement('div');d.className='msg '+(role==='user'?'user':'ai');const r=document.createElement('div');r.className='role';r.textContent=role==='user'?'你':'AI';const b=document.createElement('div');if(role==='user')b.textContent=text;else b.innerHTML=(mode?`<span class=\"mode\">${mode}</span><br>`:'')+linkify(text);d.append(r,b);chat.append(d);chat.scrollTop=chat.scrollHeight}
async function ask(text){text=(text||q.value).trim();if(!text)return;const mode=isGeminiMode(text)?'✨ Gemini + MCP 智慧回答':'⚡ MCP 快速查詢';add('user',text);q.value='';send.disabled=true;send.textContent='查詢中…';
try{const res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:text}]})});const data=await res.json();add('assistant',data.reply||data.error||'查詢失敗',mode);}
catch(e){add('assistant','連線失敗：'+e.message)}finally{send.disabled=false;send.textContent='送出'}}
clearBtn.onclick=()=>{chat.innerHTML=welcome;q.value='';q.focus();};
send.onclick=()=>ask();q.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='Enter')ask()});
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));
</script>
</body></html>
